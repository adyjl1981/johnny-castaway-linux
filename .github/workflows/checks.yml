name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0
      - name: Run tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check syntax
        run: |
          /usr/bin/python3 -m compileall -q johnny_castaway install.py launcher.py
          sh -n install.sh uninstall.sh
