name: Linux compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:24.04
          - name: Debian
            image: debian:stable
          - name: Fedora
            image: fedora:latest
          - name: Arch
            image: archlinux:latest
          - name: openSUSE
            image: opensuse/tumbleweed:latest
    name: ${{ matrix.name }} — build and desktop checks
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check dependencies, GUI fallback, X11 idle, and engine build
        run: |
          docker run --rm -e BUILD_ENGINE=1 -v "$GITHUB_WORKSPACE:/src:ro" "${{ matrix.image }}" /bin/sh -c 'mkdir -p /tmp/project; cp -R /src/. /tmp/project/; cd /tmp/project; ./scripts/ci-distro.sh'
